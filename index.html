<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可信賴專業活動評核 EPA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF9F6;--ink:#1F2A2A;--teal:#0E5A5A;--teal-soft:#E3EFEE;--line:#D8D5CC;--mid:#F2F1EA;--mid-text:#5A5A4F;--amber:#B07A1E;--l1t:#9A4A2E;--l2t:#8A6A1E;--l3t:#4A6B4A;--l4t:#0E5A5A}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 150px}
header.app{border-bottom:3px double var(--teal);padding:12px 0 10px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
header.app img{height:52px;width:52px;object-fit:contain}
header.app h1{font-family:"Noto Serif TC",serif;font-size:1.18rem;color:var(--teal)}
header.app p{font-size:.78rem;color:#6B6B60;margin-top:2px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.homelink{font-size:.78rem;color:var(--teal);text-decoration:none}
.keybtn{font-size:.75rem;color:var(--amber);border:1px solid var(--amber);padding:5px 10px;border-radius:6px;cursor:pointer;background:#fff;font-family:inherit}
.proftabs{display:flex;gap:8px;margin-bottom:10px}
.proftabs button{flex:1;padding:12px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
.proftabs button.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.domaintabs{display:flex;gap:8px;margin-bottom:14px}
.domaintabs button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--mid-text)}
.domaintabs button.on{border-color:var(--teal);background:var(--teal);color:#fff}
.epatabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.epatabs button{padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:.82rem;cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.3;text-align:left}
.epatabs button.on{border-color:var(--teal);background:var(--teal);color:#fff;font-weight:700}
.epatabs button .c{font-weight:700;display:block}
.placeholder{background:var(--mid);border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--mid-text)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:.85rem;letter-spacing:.1em;color:var(--teal);font-weight:700;margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:.78rem;color:#6B6B60}
.field input,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.95rem;font-family:inherit;background:#FDFDFB;width:100%}
.field textarea{min-height:120px;resize:vertical;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:.85rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.chips button.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500}
.lvkey{margin-bottom:14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.lvkey summary{cursor:pointer;padding:12px 16px;font-size:.85rem;font-weight:700;color:var(--teal);list-style:none}
.lvkey summary::-webkit-details-marker{display:none}
.lvkey summary::before{content:"\25B8  "}
.lvkey[open] summary::before{content:"\25BE  "}
.lvkey .body{padding:0 16px 14px;font-size:.8rem;color:#555;line-height:1.7}
.lvkey .body b{color:var(--ink)}
.overall-row{background:var(--teal-soft);border:2px solid var(--teal)!important;border-radius:8px;padding:12px!important;margin-bottom:8px}
.overall-row .name{font-weight:700!important}
.item{padding:14px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:none}
.item .name{font-weight:500;font-size:.92rem;margin-bottom:10px;display:flex;gap:8px}
.item .name .no{color:var(--teal);font-weight:700;flex-shrink:0}
.levels{display:flex;flex-wrap:wrap;gap:4px}
.levels button{min-width:38px;height:40px;padding:0 6px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:.85rem;font-family:inherit;cursor:pointer;font-weight:600}
.levels button[data-grp="1"]{color:var(--l1t)} .levels button[data-grp="2"]{color:var(--l2t)} .levels button[data-grp="3"]{color:var(--l3t)} .levels button[data-grp="4"]{color:var(--l4t)}
.levels button.on{background:var(--teal);color:#fff!important;border-color:var(--teal);font-weight:700}
.levels button.na{margin-left:auto;color:#8A8A7E;border-style:dashed}
.levels button.na.on{background:#555;color:#fff!important;border-color:#555}
.aibtn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:var(--amber);color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;margin-right:8px;margin-bottom:6px}
.aibtn.ghost{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.aibtn:disabled{opacity:.5;cursor:wait}
.ainote{font-size:.75rem;color:#8A8A7E;margin-top:8px;line-height:1.6}
.aierr{font-size:.82rem;margin-top:8px;display:none;padding:9px;border-radius:6px;line-height:1.6}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;z-index:50}
.actionbar button{padding:11px 20px;border-radius:10px;font-size:.92rem;font-weight:700;font-family:inherit;cursor:pointer}
.btn-export{background:var(--teal);color:#fff;border:none}
.btn-clear{background:#fff;color:#8A4A3A;border:1px solid var(--line)}
.barmsg{width:100%;text-align:center;font-size:.78rem;color:var(--teal);min-height:1em}
#printArea{display:none}
@media print{body *{visibility:hidden}.wrap,.actionbar{display:none}#printArea{display:block;visibility:visible;position:absolute;left:0;top:0;width:100%}#printArea *{visibility:visible}@page{size:A4;margin:12mm 14mm}}
#printArea{font-family:"Noto Sans TC","\6A19\6977\9AD4",serif;color:#000;font-size:10pt;line-height:1.5;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#printArea .pt-title{text-align:center;font-weight:700;font-size:18pt;margin-bottom:5pt}
#printArea .pt-sub{text-align:center;font-size:15pt;margin-bottom:10pt}
#printArea .pt-meta{font-size:9.5pt;margin:1pt 0}
#printArea table.meta{width:100%;border-collapse:collapse;margin-top:6pt;font-size:10pt}
#printArea table.meta td{border:1px solid #000;padding:5pt 7pt;vertical-align:top}
#printArea table.meta td.lab{background:#eef3f2;font-weight:700;white-space:nowrap;width:1%;color:#1F2A2A}
#printArea .scope-line{font-size:9.5pt;margin-top:6pt;padding:4pt 6pt;border:1px solid #000;background:#fafafa}
#printArea table{width:100%;border-collapse:collapse;margin-top:8pt;font-size:9pt}
#printArea th,#printArea td{border:1px solid #000;padding:3pt 5pt;vertical-align:top}
#printArea th{background:#eee;text-align:center}
#printArea td.lv{text-align:center;white-space:nowrap;font-weight:700;width:48pt}
#printArea tr.ov td{background:#e6f0ef;font-weight:700}
#printArea .pt-fb{margin-top:10pt;white-space:pre-wrap;line-height:1.6}
#printArea .pt-fb b{display:block;margin-bottom:3pt}
#printArea .pt-sig{margin-top:16pt;display:flex;justify-content:space-between}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}.levels button{min-width:34px;height:38px}}
</style>
</head>

  document.getElementById("barMsg").textContent="已切換至「"+DATA[k].label+"」，評分已重置。";
  setTimeout(()=>document.getElementById("barMsg").textContent="",4000);
}
function applyDomainFields(){
  const phys=DOM().extraFields;
  document.querySelectorAll(".phys-only").forEach(e=>e.style.display=phys?"flex":"none");
}
function renderTabs(){
  document.getElementById("epatabs").innerHTML=DOM().forms.map((f,i)=>
    `<button class="${i===curIdx?'on':''}" onclick="pickForm(${i})"><span class="c">${f.code}</span>${f.topic}</button>`).join("");
}
function pickForm(i){
  if(i===curIdx) return;
  curIdx=i; S.scores={}; S.overall=""; S.scope=[];
  renderTabs(); renderItems();
  document.getElementById("barMsg").textContent="已切換到 "+EPA().code+"，評分已重置。";
  setTimeout(()=>document.getElementById("barMsg").textContent="",4000);
  window.scrollTo({top:0,behavior:"smooth"});
}
function renderChips(id,arr,key,multi){
  document.getElementById(id).innerHTML=arr.map(v=>{
    const on=multi?S[key].includes(v):S[key]===v;
    return `<button onclick="pickChip('${key}','${v}',this,${!!multi})" class="${on?'on':''}">${v}</button>`;
  }).join("");
}
function pickChip(key,val,btn,multi){
  if(multi){
    const i=S[key].indexOf(val);
    if(i>=0){S[key].splice(i,1);btn.classList.remove("on");}
    else{S[key].push(val);btn.classList.add("on");}
  }else{
    S[key]=(S[key]===val)?"":val;
    btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
    if(S[key]===val) btn.classList.add("on");
  }
}
function lvButtons(prefix){
  return LEVELS.map(l=>`<button data-grp="${l.g}" onclick="pickScore('${prefix}','${l.v}',this)">${l.v}</button>`).join("")
    +`<button class="na" onclick="pickScore('${prefix}','NA',this)">NA</button>`;
}
function renderItems(){
  document.getElementById("topicTitle").textContent=EPA().code+"　主題："+EPA().topic;
  // 評估項目勾選列（僅生理 EPA1）
  document.getElementById("evalScopeWrap").style.display=EPA().evalScope?"flex":"none";
  if(EPA().evalScope) renderChips("chips_scope",SCOPE,"scope",true);
  let h="";
  if(EPA().overall){
    h+=`<div class="item overall-row"><div class="name"><span class="no">★</span><span>整體任務（總評）</span></div>
      <div class="levels" id="lv-ov">${lvButtons('ov')}</div></div>`;
  }
  h+=EPA().items.map((txt,i)=>`<div class="item"><div class="name"><span class="no">${i+1}.</span><span>${esc(txt)}</span></div>
    <div class="levels" id="lv-${i}">${lvButtons(i)}</div></div>`).join("");
  document.getElementById("itemList").innerHTML=h;
}
function pickScore(key,val,btn){
  const row=btn.parentElement;
  const cur = (key==='ov') ? S.overall : S.scores[key];
  if(cur===val){ if(key==='ov')S.overall="";else S.scores[key]=""; btn.classList.remove("on"); return; }
  if(key==='ov')S.overall=val; else S.scores[key]=val;
  row.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
}
function openKeySettings(){
  const cur=localStorage.getItem('userGeminiApiKey')||"";
  const status=cur?"✅ 此裝置已設定金鑰（結尾 …"+cur.slice(-4)+"）":"⚠️ 此裝置尚未設定金鑰";
  const input=prompt("【AI 金鑰設定】\n"+status+"\n\n・貼上 Gemini API 金鑰後按確定即可啟用一鍵整理\n・輸入 clear 可清除\n\n免費申請：aistudio.google.com → Get API key","");
  if(input===null) return;
  const v=input.trim();const msg=document.getElementById("barMsg");
  if(v.toLowerCase()==="clear"){localStorage.removeItem('userGeminiApiKey');msg.textContent="已清除金鑰。";}
  else if(v){localStorage.setItem('userGeminiApiKey',v);msg.textContent="✅ 金鑰已儲存於此裝置。";}
  else return;
  updateKeyBtn();setTimeout(()=>msg.textContent="",5000);
}
function updateKeyBtn(){
  const b=document.getElementById("keyBtn");const has=!!localStorage.getItem('userGeminiApiKey');
  b.textContent=has?"🔑 金鑰已設定":"🔑 AI 金鑰";
  b.style.background=has?"var(--teal-soft)":"#fff";b.style.color=has?"var(--teal)":"var(--amber)";
  document.getElementById("aiNote").innerHTML=has?"✅ 已設定金鑰，可直接「AI 整理」。AI 會把觀察筆記歸納為「優點／缺點／共識行動」三段填入回饋欄。":"三種方式：① 點「🔑 AI 金鑰」設定後可一鍵整理 ② 點「複製整理指令」貼到自己的 AI ③ 直接在上方回饋欄手動填寫。";
}
function buildPrompt(notes){
  return "你是職能治療臨床教師的助理。以下是教師對學員在「"+EPA().topic+"」這項可信賴專業活動（"+DOM().label+" "+EPA().code+"）的觀察筆記，請整理成正式的質性回饋，分成「優點」、「缺點」、「共識行動」三段。\n規則：\n1. 使用繁體中文、臨床專業但精簡的語氣，以具體行為描述為主，每段 1～3 句。\n2. 正向表現放入「優點」；待改進與具體建議放入「缺點」；下次觀察前可執行的具體目標放入「共識行動」。\n3. 筆記中沒有提到的內容不要編造；若某段沒有對應內容請寫「（無）」。\n4. 不要出現病人姓名等可識別資訊。\n5. 直接輸出三段，格式為：\n優點：...\n缺點：...\n共識行動：...\n\n觀察筆記：\n"+notes;
}
function showErr(html){const e=document.getElementById("aiErr");e.style.color="#A33";e.style.background="#FFF0F0";e.innerHTML=html;e.style.display="block";}
async function runAI(){
  const notes=document.getElementById("f_raw").value.trim();
  document.getElementById("aiErr").style.display="none";
  if(!notes){showErr("請先貼入觀察筆記。");return;}
  const key=localStorage.getItem('userGeminiApiKey');
  if(!key){showErr("此裝置尚未設定金鑰。可點「🔑 AI 金鑰」設定，或改用「複製整理指令」、直接手動填寫。");return;}
  const btn=document.getElementById("aiBtn");btn.disabled=true;btn.textContent="整理中…";
  const delays=[800,1600,3200];
  try{
    let out="";
    for(let a=0;a<3;a++){
      try{
        const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+key,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:buildPrompt(notes)}]}]})});
        if(!r.ok) throw new Error("HTTP "+r.status);
        const d=await r.json();out=d&&d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts[0].text||"";
        if(out)break;throw new Error("空白回應");
      }catch(e){if(a<2){await new Promise(s=>setTimeout(s,delays[a]));}else throw e;}
    }
    document.getElementById("f_fb").value=out.trim();
    document.getElementById("barMsg").textContent="✅ 已整理並填入回饋欄，請檢視後再匯出。";
    setTimeout(()=>document.getElementById("barMsg").textContent="",6000);
  }catch(e){showErr("整理失敗："+e.message+"。可改用「複製整理指令」或手動填寫。");}
  finally{btn.disabled=false;btn.textContent="✨ AI 整理";}
}
function copyPrompt(){
  const notes=document.getElementById("f_raw").value.trim();
  const err=document.getElementById("aiErr");err.style.display="none";
  if(!notes){showErr("請先貼入觀察筆記。");return;}
  const t=buildPrompt(notes);
  function ok(){err.style.color="#2A6B3A";err.style.background="#E8F1E6";err.innerHTML="✅ 已複製整理指令，請貼到 <a href='https://gemini.google.com/' target='_blank'>Gemini</a>、<a href='https://chatgpt.com/' target='_blank'>ChatGPT</a> 或 <a href='https://claude.ai/' target='_blank'>Claude</a>，把結果貼回上方回饋欄。";err.style.display="block";}
  function manual(){err.style.color="#5A5A4F";err.style.background="#F2F1EA";err.innerHTML="此瀏覽器不允許自動複製，<b>點下方框會自動全選</b>，再手動複製：";const ta=document.createElement("textarea");ta.value=t;ta.readOnly=true;ta.style.cssText="width:100%;min-height:140px;margin-top:8px;padding:8px;font-family:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:8px";ta.addEventListener("click",function(){this.focus();this.setSelectionRange(0,this.value.length);});err.appendChild(ta);err.style.display="block";}
  function legacy(){const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;left:-9999px";document.body.appendChild(ta);ta.select();let s=false;try{s=document.execCommand("copy");}catch(e){}document.body.removeChild(ta);s?ok():manual();}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok).catch(legacy);}else legacy();
}
function buildPrint(){
  const g=id=>document.getElementById(id).value.trim();
  const cell=(lab,val)=>`<td class="lab">${lab}</td><td>${esc(val)||"&nbsp;"}</td>`;
  let rowsMeta = `<tr>${cell("日期",g('f_date'))}${cell("被評核者",g('f_ratee'))}</tr>`
    + `<tr>${cell("評核者",g('f_rater'))}${cell("年資",g('f_exp'))}</tr>`
    + `<tr>${cell("身分別",S.role)}${cell("個案來源",S.src)}</tr>`
    + `<tr>${cell("個案診斷",g('f_dx'))}` + (DOM().extraFields ? cell("科別",g('f_dept')) : `<td class="lab">　</td><td>&nbsp;</td>`) + `</tr>`
    + (DOM().extraFields ? `<tr>${cell("病房",g('f_ward'))}<td class="lab">　</td><td>&nbsp;</td></tr>` : "");
  let metaTable = `<table class="meta">${rowsMeta}</table>`;
  let scopeRow = EPA().evalScope && S.scope.length ? `<div class="scope-line"><b>評估項目包含：</b>${S.scope.map(esc).join("、")}</div>` : "";
  let ovRow = EPA().overall ? `<tr class="ov"><td>★ 整體任務（總評）</td><td class="lv">${S.overall||"—"}</td></tr>` : "";
  const rows=EPA().items.map((txt,i)=>`<tr><td>${i+1}. ${esc(txt)}</td><td class="lv">${S.scores[i]||"—"}</td></tr>`).join("");
  const fb=document.getElementById("f_fb").value.trim();
  document.getElementById("printArea").innerHTML=`
    <div style="text-align:center;margin-bottom:6pt"><img src="${BUILTIN_LOGO}" style="height:64pt"></div>
    <div class="pt-title">社團法人臺灣職能治療學會 可信賴專業活動評核（${esc(DOM().label)}）</div>
    <div class="pt-sub">${EPA().code}　主題：${esc(EPA().topic)}</div>
    ${metaTable}
    ${scopeRow}
    <div style="height:18pt"></div>
    <table><thead><tr><th>評核項目</th><th>信賴等級</th></tr></thead><tbody>${ovRow}${rows}</tbody></table>
    <div class="pt-fb"><b>其他質性回饋：</b>${esc(fb)||"（未填寫）"}</div>
    <div class="pt-sig"><span style="white-space:nowrap">學員簽章：<span style="display:inline-block;width:42mm;border-bottom:1px solid #000">&nbsp;</span></span><span style="white-space:nowrap">教師簽章：<span style="display:inline-block;width:42mm;border-bottom:1px solid #000">&nbsp;</span></span></div>`;
}
async function exportPDF(mode){
  mode=mode||"save";const isShare=mode==="share";
  buildPrint();
  const area=document.getElementById("printArea"),msg=document.getElementById("barMsg");
  const shareBtn=document.getElementById("shareBtn");shareBtn.disabled=true;
  const actBtn=isShare?shareBtn:document.querySelector(".btn-export");actBtn.textContent="產生中…";
  area.style.cssText="display:block;position:fixed;left:0;top:0;width:794px;background:#fff;padding:38px 44px;z-index:-1";
  try{
    const canvas=await html2canvas(area,{scale:2,backgroundColor:"#fff"});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF("p","mm","a4");
    const pageW=210,pageH=297,imgW=pageW,imgH=canvas.height*pageW/canvas.width;
    const d=(document.getElementById("f_date").value||new Date().toISOString().slice(0,10));
    const who=document.getElementById("f_ratee").value.trim()||"學員";
    const fname=DOM().label+"_"+EPA().code+"_"+who+"_"+d+".pdf";
    if(imgH<=pageH){pdf.addImage(canvas.toDataURL("image/jpeg",0.95),"JPEG",0,0,imgW,imgH);}
    else if(imgH<=pageH*1.15){const sc=pageH/imgH;pdf.addImage(canvas.toDataURL("image/jpeg",0.95),"JPEG",(pageW-imgW*sc)/2,0,imgW*sc,pageH);}
    else{let pos=0;while(pos<imgH){if(pos>0)pdf.addPage();pdf.addImage(canvas.toDataURL("image/jpeg",0.95),"JPEG",0,-pos,imgW,imgH);pos+=pageH;}}
    if(isShare){
      const blob=pdf.output("blob");const file=new File([blob],fname,{type:"application/pdf"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:fname});msg.textContent="已開啟分享選單。";}
        catch(e){if(e.name!=="AbortError")msg.textContent="分享未完成："+e.message;}
      }else{pdf.save(fname);msg.textContent="此瀏覽器不支援分享，已改為下載。";}
    }else{pdf.save(fname);msg.textContent="PDF 已產生，請查看下載項目。";}
  }catch(e){msg.textContent="產生失敗："+e.message;}
  finally{area.style.cssText="";document.querySelector(".btn-export").textContent="匯出 PDF";shareBtn.disabled=false;shareBtn.textContent="📤 分享 / 寄送";setTimeout(()=>msg.textContent="",6000);}
}
function clearAll(){
  if(!confirm("確定清除目前表單所有已填內容？"))return;
  if(!confirm("再次確認：清除後無法復原。"))return;
  ["f_date","f_rater","f_ratee","f_exp","f_dx","f_dept","f_ward","f_fb","f_raw"].forEach(id=>document.getElementById(id).value="");
  S.role="";S.src="";S.scope=[];S.scores={};S.overall="";
  renderChips("chips_role",ROLES,"role");renderChips("chips_src",SRCS,"src");renderItems();
  document.getElementById("barMsg").textContent="已清除。";
  setTimeout(()=>document.getElementById("barMsg").textContent="",4000);
}
renderDomainTabs();renderTabs();applyDomainFields();
renderChips("chips_role",ROLES,"role");renderChips("chips_src",SRCS,"src");
renderItems();updateKeyBtn();
</script>
